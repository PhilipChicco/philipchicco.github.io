# Publications: the single source for the homepage, the Publications page and
# the Research page. Newest first. Only "title", "authors", "venue" and "year"
# are required; everything else is optional.
#
#   title:      Paper title
#   authors:    [List, Of, Names]        # your name is bolded automatically
#   venue:      Short label for the badge, e.g. "MICCAI 2024" or "IEEE TMI"
#   venue_full: Full journal/conference name (shown in the citation line)
#   year / date: Used for grouping and sorting
#   type:       journal | conference | preprint   (drives the filter chips)
#   doi:        10.xxxx/...              # used for the BibTeX entry
#   links:      { paper: URL, pdf: URL, code: URL, project: URL, arxiv: URL }
#   image:      /assets/img/pubs/<name>.png   # optional thumbnail (16:10 works best)
#   selected:   true                     # show on the homepage
#   topics:     [medical-imaging, few-shot, vision-language]   # links it to a Research area
#   highlight:  "Nature Portfolio" / "Oral"   # optional badge; highlighted papers are featured on the homepage
#   news:       "One-line announcement"  # optional: also posts it to News on "date"
#
# To add new papers automatically: python3 scripts/sync_publications.py
# (also runs weekly on GitHub and opens a pull request for you to review).

